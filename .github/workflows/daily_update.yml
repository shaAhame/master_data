name: Update Master Data

on:
  schedule:
    - cron: '0 7 * * *'  # Runs daily at 7:00 UTC
  workflow_dispatch:  # allows manual run

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install gspread pandas gspread_dataframe gspread-formatting oauth2client

      - name: Write Google credentials
        run: |
          echo "${{ secrets.GOOGLE_CREDS }}" | base64 --decode > credentials.json

      - name: Verify credentials file
        run: |
          if [ ! -s credentials.json ]; then
            echo "ERROR: credentials.json is empty or missing!"
            exit 1
          else
            echo "credentials.json created successfully"
          fi

      - name: Run update script
        run: |
          python update_data.py

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f credentials.json
