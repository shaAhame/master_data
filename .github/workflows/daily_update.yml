name: Update Master Data

on:
  schedule:
    - cron: '30 17 * * *'  # Runs daily at 17:30 UTC
  workflow_dispatch:      # allows manual run

permissions:
  contents: write         # REQUIRED: allows pushing the CSV back to the repo

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install gspread pandas gspread_dataframe gspread-formatting oauth2client

      - name: Write Google credentials
        run: |
          echo "${{ secrets.GOOGLE_CREDS }}" | base64 --decode > credentials.json

      - name: Verify credentials file
        run: |
          if [ ! -s credentials.json ]; then
            echo "ERROR: credentials.json is empty or missing!"
            exit 1
          else
            echo "credentials.json created successfully"
          fi

      - name: Run update script
        run: |
          python update_data.py

      # ✅ THIS WAS MISSING — saves the updated CSV back to the repo
      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/master_db.csv
          git diff --staged --quiet || git commit -m "Auto-update master_db.csv [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f credentials.json
